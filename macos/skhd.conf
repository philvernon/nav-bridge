# Source or copy these bindings into skhdrc.
# Central Alt+hjkl navigation across tmux panes and yabai windows.

alt - h : "__NAV_BRIDGE_DIR__/macos/mac-nav.sh" L
alt - j : "__NAV_BRIDGE_DIR__/macos/mac-nav.sh" D
alt - k : "__NAV_BRIDGE_DIR__/macos/mac-nav.sh" U
alt - l : "__NAV_BRIDGE_DIR__/macos/mac-nav.sh" R
