# Source or copy these bindings into skhdrc.
# Central Alt+hjkl navigation across tmux panes and yabai windows.

alt - h : $HOME/dev/nav-bridge/macos/mac-nav.sh L
alt - j : $HOME/dev/nav-bridge/macos/mac-nav.sh D
alt - k : $HOME/dev/nav-bridge/macos/mac-nav.sh U
alt - l : $HOME/dev/nav-bridge/macos/mac-nav.sh R
