set -g default-terminal "tmux-256color"
set-option -g default-shell /bin/zsh
# set-option -sa terminal-overrides ",alacritty:RGB"
set-option -sa terminal-overrides ",foot*:Tc"
set -g status-bg "#1E1E2E"
set -g status-fg white
set -Fg 'status-format[1]' '#{status-format[0]}'
set-option -g status-style bg=default
set-option -sg escape-time 10
set-option -g focus-events on

set -g visual-activity off
set -g visual-bell off

setw -g mouse on

# Change prefix to Ctrl - b which is mapped to alt - e in skhd
set-option -g prefix C-b
bind-key C-b send-prefix

setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind h split-window -h -b -c "#{pane_current_path}"
bind j split-window -v -c "#{pane_current_path}"
bind k split-window -v -b -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"



# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r split-window -h -c "#{pane_current_path}" \; resize-pane -R 40

set -g status-right ''

setw -g window-status-current-style fg=colour1 
setw -g window-status-current-style bg="#45475A"
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]#F '

setw -g window-status-style fg=colour1 
setw -g window-status-style bg="#1E1E2E"
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'pschmitt/tmux-ssh-split'

# tmux ssh
set-option -g @ssh-split-keep-cwd "true"
set-option -g @ssh-split-keep-remote-cwd "true"
set-option -g @ssh-split-w-key "C"


set -g update-environment "TMUX_REMOTE_NAV"
if-shell '[ "$TMUX_REMOTE_NAV" = 1 ]' {
		bind -n M-h run-shell '~/.config/tmux/ssh_nav.sh L'
		bind -n M-j run-shell '~/.config/tmux/ssh_nav.sh D'
		bind -n M-k run-shell '~/.config/tmux/ssh_nav.sh U'
		bind -n M-l run-shell '~/.config/tmux/ssh_nav.sh R'
}

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

