# Source this file from the main tmux configuration.
# Extracted from ~/.config/tmux/tmux.conf.

set -g extended-keys on
set -g extended-keys-format csi-u

# Prefix-based directional pane creation.
bind l split-window -h -c "#{pane_current_path}"
bind j split-window -v -c "#{pane_current_path}"
bind h split-window -h -b -c "#{pane_current_path}"
bind k split-window -v -b -c "#{pane_current_path}"

# Prefixless session and window navigation.
bind-key -n M-q switch-client -p
bind-key -n M-w switch-client -n
bind-key -n M-z switch-client -l
bind-key -n M-u previous-window
bind-key -n M-i next-window
bind-key -n M-y last-window

bind-key -n M-Enter new-window -c "#{pane_current_path}"
