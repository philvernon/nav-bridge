# Linux Sway integration for nav-bridge.
# install.sh defines $nav_bridge_dir before including this file.

set $nav_bridge_mod Mod4

# Navigate across tmux panes and Sway containers.
bindsym $nav_bridge_mod+h exec "$nav_bridge_dir/linux/linux-nav.sh L"
bindsym $nav_bridge_mod+j exec "$nav_bridge_dir/linux/linux-nav.sh D"
bindsym $nav_bridge_mod+k exec "$nav_bridge_dir/linux/linux-nav.sh U"
bindsym $nav_bridge_mod+l exec "$nav_bridge_dir/linux/linux-nav.sh R"

# Direct Sway navigation with arrow keys.
bindsym $nav_bridge_mod+Left focus left
bindsym $nav_bridge_mod+Down focus down
bindsym $nav_bridge_mod+Up focus up
bindsym $nav_bridge_mod+Right focus right

# Move Sway containers.
bindsym $nav_bridge_mod+Shift+h move left
bindsym $nav_bridge_mod+Shift+j move down
bindsym $nav_bridge_mod+Shift+k move up
bindsym $nav_bridge_mod+Shift+l move right
bindsym $nav_bridge_mod+Shift+Left move left
bindsym $nav_bridge_mod+Shift+Down move down
bindsym $nav_bridge_mod+Shift+Up move up
bindsym $nav_bridge_mod+Shift+Right move right
