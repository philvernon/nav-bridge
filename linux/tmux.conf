# Linux tmux integration for nav-bridge.
# install.sh defines @nav_bridge_dir before sourcing this file.

# Import the remote-navigation flag when a client attaches.
set-option -ag update-environment " TMUX_REMOTE_NAV"

if-shell '[ "$TMUX_REMOTE_NAV" = 1 ]' {
    bind-key -n M-h run-shell '"#{@nav_bridge_dir}/linux/ssh-nav.sh" L'
    bind-key -n M-j run-shell '"#{@nav_bridge_dir}/linux/ssh-nav.sh" D'
    bind-key -n M-k run-shell '"#{@nav_bridge_dir}/linux/ssh-nav.sh" U'
    bind-key -n M-l run-shell '"#{@nav_bridge_dir}/linux/ssh-nav.sh" R'
}
